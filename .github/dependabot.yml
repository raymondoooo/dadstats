version: 2
updates:
  # Grouped on purpose. Ungrouped npm updates produce a PR per package per week, which on a
  # spare-time project means they get ignored wholesale — including the one that mattered.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Patch and minor only. Dependabot has no idea which Node majors are LTS, and it proposed
    # node 26 — a Current release, not LTS — which better-sqlite3 can't even compile against.
    # Major base-image moves are a deliberate decision made at LTS transitions, not a PR to merge
    # on a Tuesday. Revisit when the current LTS goes into maintenance.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
