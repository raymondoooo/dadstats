name: Test and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Builds the image and exercises it the way a user would: start the container, create a family
  # through the admin API, score a game, and confirm two devices scoring at once merge correctly.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Loaded into the local daemon rather than pushed — this image only has to run here.
      # Static, no container needed — fails fast before anything is built.
      - name: Markup check
        run: node test/markup-check.js

      # Pure function, no container and no network: the SSRF guard's address ranges. Kept out of
      # the live suite deliberately — a fixture server it could actually reach in CI would have to
      # sit at a private address, which the guard correctly refuses, so exercising it live would
      # mean weakening the thing under test. See test/ical-guard-check.js.
      - name: Calendar feed SSRF guard (unit)
        run: node test/ical-guard-check.js

      # Runs the real mergeStates in a sandbox: repeated merges must not grow the state. A
      # tombstone that failed to match itself once reached 13,440 copies on a live account.
      - name: Merge does not grow the state (unit)
        run: node test/merge-growth-check.js

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dadstats:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name dadstats-ci -p 3208:3211 \
            -e ADMIN_PASSWORD=ci-admin-password \
            -v dadstats-ci-data:/app/data \
            dadstats:ci
          # Poll rather than sleep — the first boot applies the schema and generates secrets.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3208/api/health >/dev/null; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "container failed to become healthy"; docker logs dadstats-ci; exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Installed outside the repo on purpose: `npm install` in the root would pull in the app's
      # own dependencies too, needlessly recompiling better-sqlite3 on the runner when the
      # container under test already has it, and would rewrite package.json.
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          APP_URL: http://localhost:3208
          ADMIN_PASSWORD: ci-admin-password
          NODE_PATH: /tmp/pw/node_modules
        run: |
          node test/admin-check.js
          node test/ui-check.js
          node test/sync-check.js
          node test/sport-check.js
          node test/measurement-check.js
          node test/tombstone-check.js
          node test/ical-check.js
          node test/dialog-check.js

      # First-run setup only exists on an instance with no families, so it needs its own
      # untouched container rather than the one the tests above have been creating families in.
      - name: Start a virgin instance for the setup check
        run: |
          docker run -d --name dadstats-virgin -p 3209:3211 \
            -v dadstats-virgin-data:/app/data dadstats:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3209/api/health >/dev/null; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "virgin instance failed to start"; docker logs dadstats-virgin; exit 1

      - name: Run first-run setup check
        env:
          APP_URL: http://localhost:3209
          NODE_PATH: /tmp/pw/node_modules
        run: node test/setup-check.js

      # Its own virgin instance rather than sharing 3209: this check completes setup itself, so
      # running both against one container would leave whichever ran second facing an
      # already-configured instance and no setup form.
      - name: Start a virgin instance for the empty-state check
        run: |
          docker run -d --name dadstats-virgin2 -p 3252:3211 \
            -v dadstats-virgin2-data:/app/data dadstats:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3252/api/health >/dev/null; then echo "up"; exit 0; fi
            sleep 1
          done
          echo "second virgin instance failed to start"; docker logs dadstats-virgin2; exit 1

      # A fresh account must open empty, and adding a kid must never presume basketball.
      - name: Empty first-run state and sport choice
        env:
          APP_URL: http://localhost:3252
          NODE_PATH: /tmp/pw/node_modules
        run: node test/empty-state-check.js

      # Image and runtime invariants: no build toolchain, OCI labels, unprivileged process,
      # healthcheck reaches healthy, data survives a container *recreate*, and a bind mount to a
      # host path Docker had to create still starts. Manages its own containers.
      - name: Image and runtime invariants
        env:
          IMAGE: dadstats:ci
          PORT: '3251'
          BIND_DIR: /tmp/dadstats-bindcheck
        run: ./test/image-check.sh

      # Manages its own pair of containers on one port, so it can't share with the suites above.
      - name: Account binding (cache must not cross accounts)
        env:
          IMAGE: dadstats:ci
          CPORT: '3211'
          PORT: '3280'
          NODE_PATH: /tmp/pw/node_modules
        run: ./test/run-account-check.sh

      # Runs last on purpose: it deliberately trips the login rate limiter, which would then
      # block the family logins every other suite needs.
      - name: Security regressions
        env:
          APP_URL: http://localhost:3208
          ADMIN_PASSWORD: ci-admin-password
          NODE_PATH: /tmp/pw/node_modules
        run: node test/security-check.js

      - name: Container logs on failure
        if: failure()
        run: docker logs dadstats-ci

  # Multi-arch publish. arm64 matters more than usual here: a lot of self-hosters run this class
  # of app on a Raspberry Pi or an ARM VPS, and better-sqlite3 is a native module, so the arm64
  # image genuinely has to be built rather than assumed to work.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR with the built-in token
    steps:
      - uses: actions/checkout@v7

      # Registers binfmt handlers so the arm64 image can be built on an amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Published to both registries. Docker Hub rate-limits anonymous pulls, which bites anyone
      # who redeploys often; GHCR doesn't, and needs no secret beyond the built-in token.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names come from the secret / repo owner, so nothing here hardcodes an account.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dadstats
            ghcr.io/${{ github.repository }}
          # Two channels, decided by whether the tag is a prerelease — a hyphen in the tag name,
          # per semver (v0.3.0-beta.1 is a prerelease, v0.3.0 is not).
          #
          # Stable gets the full ladder, so people can pin at whatever risk level suits them:
          # exact, minor, major, or "whatever's newest".
          #
          # A prerelease publishes ONLY its exact version plus a moving :beta. It must never
          # touch :latest, :0.3 or :0 — anyone pinned to those asked for stable, and shipping
          # them a beta because it happens to be newer is how you lose people running this on
          # their own hardware.
          #
          # The conditions are spelled out rather than leaning on metadata-action's implicit
          # prerelease handling: being subtly wrong here means pushing a beta to every install.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Tag minus the leading v, so the footer reads "v0.3.0" not "vv0.3.0".
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Its own job, deliberately, rather than a final step of `publish`. The Docker Hub listing is
  # documentation and nothing was pushing it — it sat for four releases still telling people to
  # map port 3108, which stopped being right in 0.4.0, so anyone copy-pasting the quick start got
  # a container they couldn't reach. Syncing from the repo means it can't drift again.
  #
  # Separated because the two failures mean different things and shouldn't share a red X. If this
  # job fails, the images published perfectly well and only the description didn't — collapsing
  # that into `publish: failure` says "the release broke", which isn't true and sends you looking
  # in the wrong place.
  #
  # Stable only: a prerelease shouldn't rewrite the page everyone on :latest reads.
  #
  # Also runnable on its own via workflow_dispatch, so fixing a typo on the listing doesn't
  # require cutting a release nobody needs. `always()` is what lets it run in that case: without
  # it, `needs: publish` would skip this job too, because publish is itself skipped when there's
  # no tag. The publish-result check keeps the release path honest — if the images failed to
  # build, don't advertise them.
  describe:
    needs: publish
    if: >-
      always() &&
      needs.publish.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' ||
       (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Mapped to an env var because the `secrets` context can't be read from an `if:` condition.
    env:
      HAS_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      # Needs DOCKERHUB_PASSWORD (the account password), not the PAT used for pushing images:
      # Docker Hub's description API rejects a PAT with "Forbidden", which is exactly how this
      # failed the first time it ran. Absent the secret the job no-ops rather than failing every
      # release — docs/dockerhub-description.md can always be pasted in by hand instead.
      - name: Sync Docker Hub description
        if: env.HAS_PASSWORD == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/dadstats
          # Docker Hub caps this at 100 characters and rejects anything longer — 97 here.
          short-description: "Self-hosted stat tracker for kids' sports — score from the stands, two phones at once. 11 sports."
          readme-filepath: ./docs/dockerhub-description.md

      - name: Note when the sync was skipped
        if: env.HAS_PASSWORD != 'true'
        run: |
          echo "DOCKERHUB_PASSWORD is not set, so the Docker Hub description was not updated."
          echo "Add it as a repository secret, or paste docs/dockerhub-description.md into the"
          echo "description box on Docker Hub by hand."
          echo "The images for this release published normally either way."

